<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="#B3202A" />
      <path d="M5 8c6 3 6 13 0 16M27 8c-6 3-6 13 0 16" fill="none" stroke="#F3E6C8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.4" />
    </svg>
    <h1>Run Count</h1>
  </div>
  @if (svc.state()) {
    <div class="actions">
      <button type="button" (click)="svc.undo()" [disabled]="!svc.canUndo()">Undo last</button>
      <button type="button" (click)="newMatch()">New match</button>
    </div>
  }
</header>

<main>
  <nav class="tabs" aria-label="Sections">
    @if (svc.state()) {
      <a routerLink="/match" routerLinkActive="on">Score</a>
      <a routerLink="/scorecard" routerLinkActive="on">Scorecard</a>
    } @else {
      <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">New match</a>
    }
    <a routerLink="/rules" routerLinkActive="on">ICC rules</a>
  </nav>

  @if (svc.error()) {
    <p class="error" role="alert">{{ svc.error() }}</p>
  }

  <router-outlet />
</main>
